aid: screenleap-inc
name: Screenleap Inc
description: >-
  Screenleap is a Y Combinator-backed company whose API lets developers add live
  screen sharing, video conferencing, audio conferencing and chat to their own
  websites and online products. Integrations create a session server-to-server
  over a REST/JSON HTTP interface (base https://api.screenleap.com/v2), load a
  hosted screenleap.js library on the presenter's page, and render the share to
  viewers through a returned viewer URL or embedded iframe. Authentication uses
  an account id plus an auth token; billing is per participant-minute (Basic
  $0.003/min, White-Label $0.010/min) with no Screenleap subscription required.
